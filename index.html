<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagine AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101014;
      color: white;
      text-align: center;
      padding: 25px;
    }
    h1 { color: #a78bfa; }
    textarea {
      width: 90%;
      max-width: 500px;
      height: 120px;
      padding: 15px;
      border-radius: 12px;
      background: #24242c;
      color: white;
      border: 1px solid #555;
    }
    button {
      margin-top: 15px;
      padding: 14px 25px;
      background: #805ad5;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>🎨 Imagine AI</h1>
  <p>Create your imagination with AI</p>

  <textarea placeholder="Describe your image..."></textarea>
  <br>
  <button>Generate Image</button>

  <p>Assamese | English</p>
</body>
</html>
